<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
</head>

<body>
    <header>
        <div class="container text-center text-primary py-3">
            <h1>Bootstrap 5: Display Classes</h1>
        </div>
        <div class="container ">
            <div class="row">
                <div class="col-12 bg-light text-center text-dark d-flex flex-sm-column my-3 py-5 main ">
                    <h2>Justify Content</h2>
                    <div class="row">
                        <div class="col-12 col-md-3 bg-primary mx-5 my-3 d-flex box justify-content-start">This text is placed at the leftside.</div>
                        <div class="col-12 col-md-3 bg-primary mx-5 my-3 d-flex box justify-content-center">This text is placed at the center.</div>
                        <div class="col-12 col-md-3 bg-primary mx-5 my-3 d-flex box justify-content-end">This text is placed at the right.</div>

                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 bg-light text-center text-dark d-flex flex-sm-column my-3 py-3 main ">
                    <h2>Align Items</h2>
                    <div class="row">
                        <div class="col-12 col-md-3 bg-primary mx-5 my-3 d-flex box align-items-start">This text is placed at the leftside.</div>
                        <div class="col-12 col-md-3 bg-primary mx-5 my-3 d-flex box align-items-center">This text is placed at the center.</div>
                        <div class="col-12 col-md-3 bg-primary mx-5 my-3 d-flex box align-items-end">This text is placed at the right.</div>

                    </div>
                </div>
            </div>
        </div>
        <div class="container bg-dark d-block">
            <div class="row">
                <div class="col-12 text-white text-center d-md-none d-sm-block py-3 my-2 bg-danger red">Small</div>
            </div>
            <div class="row">
                <div class="col-12 text-white text-center d-sm-none d-xl-none d-md-block py-3 my-2 bg-success red">Medium</div>
            </div>
            <div class="row">
                <div class="col-12 text-white text-center d-sm-none d-xl-block  py-3 my-2 bg-warning red">Large</div>
            </div>
        </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
</body>

</html>
